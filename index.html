<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Games</title>

    <!-- Resource Hints for faster game CDN and asset loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
    <link rel="dns-prefetch" href="https://raw.githubusercontent.com" />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />

    <script>
      // Suppress benign Vite dev server WebSocket disconnect error
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason;
        var msg = (reason && (reason.message || reason.toString())) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('ws://') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(e) {
        var msg = (e.message || '') + '';
        if (msg.indexOf('WebSocket') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
    <meta name="description" content="Minimalist dark-themed web game portal with on-demand download, 30-day cache, and Unity WASM / WebGL game player." />
    <meta property="og:title" content="Games" />
    <meta property="og:description" content="Minimalist dark-themed web game portal with on-demand download, 30-day cache, and Unity WASM / WebGL game player." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
